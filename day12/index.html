<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Buổi 12 - Nguyễn Minh Hiếu - Bài tập khóa học Fullstack online F8</title>
        <script src="https://kit.fontawesome.com/0c9b48e69b.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="stylesheet" href="./assets/css/styles.css" />
    </head>
    <body class="text-[#d1d5dc]">
        <div class="wrapper">
            <!-- Change color -->
            <section>
                <h2 class="mb-6 font-[800] text-[24px] text-white text-shadow-xl">
                    Phần 1: Random màu nền bằng mã HEX
                </h2>
                <div
                    class="js-change-color flex flex-col items-center justify-center w-full h-[200px] rounded-[10px] bg-cyan-500"
                >
                    <button
                        class="js-btn-change-color min-w-[120px] py-3 px-4 bg-white text-[#000] font-medium rounded-xl border-3 border-gray-200 transition-all duration-200 active:scale-[0.98] cursor-pointer select-none"
                        onclick="boxBg.style.backgroundColor = generateRandomHexColor()"
                    >
                        Đổi màu
                    </button>
                </div>
            </section>
            <div class="separate"></div>
            <!-- Filters -->
            <section>
                <div class="flex items-center justify-between mb-4">
                    <h2 class="mb-6 font-[800] text-[24px] text-white text-shadow-xl">
                        Phần 2: Bộ lọc và sắp xếp giỏ hàng
                    </h2>
                    <div class="flex items-center gap-4">
                        <!-- Theo danh mục -->
                        <div class="relative">
                            <button
                                class="js-filter-btn flex items-center gap-2 px-4 py-2 bg-white/20 rounded-[8px] border-2 border-gray-600 font-[500] select-none cursor-pointer active:scale-[0.98]"
                            >
                                <i class="fa-solid fa-filter-circle-dollar"></i>Lọc theo danh mục
                            </button>
                            <ul
                                class="js-filter-category-list filter-list absolute top-[calc(100%+20px)] right-0 min-w-full p-4 rounded-[8px] bg-gray-700 opacity-0 invisible -translate-y-[4px] transition-opacity transition-transform duration-300 [.active]:opacity-100 [.active]:visible [.active]:translate-y-[0] before:absolute before:top-[-20px] before:right-[10px] before:border-[10px] before:border-transparent before:border-b-gray-700"
                            ></ul>
                        </div>

                        <!-- Theo giá -->
                        <div class="relative">
                            <button
                                class="js-filter-btn flex items-center gap-2 px-4 py-2 bg-white/20 rounded-[8px] border-2 border-gray-600 font-[500] select-none cursor-pointer active:scale-[0.98]"
                            >
                                <i class="fa-solid fa-filter-circle-dollar"></i>Lọc theo giá
                            </button>
                            <ul
                                class="js-filter-price-list filter-list absolute top-[calc(100%+20px)] right-0 min-w-full p-4 rounded-[8px] bg-gray-700 opacity-0 invisible -translate-y-[4px] transition-opacity transition-transform duration-300 [.active]:opacity-100 [.active]:visible [.active]:translate-y-[0] before:absolute before:top-[-20px] before:right-[10px] before:border-[10px] before:border-transparent before:border-b-gray-700"
                            ></ul>
                        </div>
                    </div>
                </div>
                <table class="table">
                    <tr class="text-white">
                        <th class="w-1/2">Tên</th>
                        <th class="w-1/3">Giá</th>
                        <th class="w-1/3">Danh mục</th>
                    </tr>
                    <tbody class="js-products-list"></tbody>
                </table>

                <div class="js-total-bill mt-[30px] text-right">
                    <ul>
                        <li class="mt-3 font-bold text-white text-[20px]">
                            Tổng thanh toán: <span class="js-total-price"></span> VNĐ
                        </li>
                    </ul>
                </div>
            </section>
            <div class="separate"></div>
            <!-- Random OTP -->
            <section>
                <h2 class="mb-6 font-[800] text-[24px] text-white text-shadow-xl">Phần 3: Tạo mã OTP ngẫu nhiên</h2>
                <div
                    class="w-full max-w-md p-8 bg-[#fff]/10 backdrop-blur-xl border border-gray-800 rounded-2xl shadow-2xl shadow-cyan-500/10"
                >
                    <div class="text-center mb-6">
                        <h2 class="text-xl font-bold tracking-wide text-gray-100">XÁC THỰC BẢO MẬT</h2>
                        <p class="text-xs text-gray-400 mt-1">Vui lòng nhấn nút để tạo mã OTP ngẫu nhiên</p>
                    </div>
                    <div class="js-otp flex justify-center gap-3 mb-6"></div>
                    <div class="text-center text-xs text-gray-400 mb-6">Mã sẽ được tạo tự động</div>
                    <button
                        class="js-otp-btn w-full py-3 px-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-medium rounded-xl shadow-lg shadow-cyan-500/25 transition-all duration-200 active:scale-[0.98] cursor-pointer select-none"
                    >
                        Tạo Mã OTP Mới
                    </button>
                </div>
            </section>
        </div>

        <!-- Scripts -->
        <script src="./assets/js/task1.js"></script>
        <script src="./assets/js/task2.js"></script>
        <script src="./assets/js/task3.js"></script>
        <script src="./assets/js/render.js"></script>
    </body>
</html>
